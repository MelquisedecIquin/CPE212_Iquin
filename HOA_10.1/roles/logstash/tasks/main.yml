---
- name: Install Logstash
  ansible.builtin.apt:
    name: logstash
    state: present

- name: Create certs directory
  ansible.builtin.file:
    path: /etc/logstash/certs
    state: directory
    owner: root
    group: logstash
    mode: "0750"

- name: Copy Elasticsearch CA certificate
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/http_ca.crt"
    dest: /etc/logstash/certs/http_ca.crt
    owner: root
    group: logstash
    mode: "0640"
  notify: Restart logstash

- name: Deploy Beats pipeline
  ansible.builtin.template:
    src: beats.conf.j2
    dest: /etc/logstash/conf.d/beats.conf
    owner: root
    group: logstash
    mode: "0640"
  notify: Restart logstash

- name: Enable and start Logstash
  ansible.builtin.systemd:
    name: logstash
    enabled: true
    state: started
    daemon_reload: true
